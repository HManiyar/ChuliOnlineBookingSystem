<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gallery — Chuli Tirth Dharamshala</title>
<meta name="robots" content="noindex" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&family=Noto+Sans+Gujarati:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
<link rel="stylesheet" href="assets/css/site.css" />
</head>
<body>
<div class="ct-preview-banner" data-i18n="PreviewBannerText"></div>
<div id="ct-navbar-mount"></div>

<main id="ct-main">
<section class="ct-section">
  <div class="container-ct">
    <div class="ct-section-title"><h2 data-i18n="Gallery"></h2></div>
    <div class="ct-grid" style="grid-template-columns: repeat(auto-fill, minmax(200px,1fr));" id="galleryMount"></div>
  </div>
</section>
</main>

<div id="ct-footer-mount"></div>

<script src="assets/js/data.js"></script>
<script>
  window.renderDynamicContent = function (lang) {
    var mount = document.getElementById("galleryMount");
    mount.innerHTML = GALLERY.map(function (g) {
      return '<div><a href="' + g.image + '" class="ct-gallery-img-link"><img src="' + g.image + '" alt="' + g.category[lang] + '" loading="lazy" style="width:100%;height:170px;object-fit:cover;border-radius:var(--ct-radius);" /></a>' +
        '<div class="ct-muted mt-1" style="font-size:0.85rem;text-align:center;">' + g.category[lang] + '</div></div>';
    }).join("");
  };
</script>
<script src="assets/js/site.js"></script>
</body>
</html>
