<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contact Us — Chuli Tirth Dharamshala</title>
<meta name="robots" content="noindex" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&family=Noto+Sans+Gujarati:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
<link rel="stylesheet" href="assets/css/site.css" />
</head>
<body>
<div class="ct-preview-banner" data-i18n="PreviewBannerText"></div>
<div id="ct-navbar-mount"></div>

<main id="ct-main">
<section class="ct-section">
  <div class="container-ct" style="max-width:600px;">
    <div class="ct-section-title" style="text-align:left;"><h2 data-i18n="ContactUs"></h2></div>
    <form class="ct-card" style="padding:1.5rem;" data-preview-form>
      <div class="mb-3 ct-field"><label data-i18n="NameLabel"></label><input class="form-control" /></div>
      <div class="mb-3 ct-field"><label data-i18n="EmailLabel"></label><input type="email" class="form-control" /></div>
      <div class="mb-3 ct-field"><label data-i18n="MobileNumberLabel"></label><input class="form-control" /></div>
      <div class="mb-3 ct-field"><label data-i18n="SubjectLabel"></label><input class="form-control" /></div>
      <div class="mb-3 ct-field"><label data-i18n="MessageLabel"></label><textarea rows="4" class="form-control"></textarea></div>
      <button type="submit" class="btn-ct-primary" data-i18n="SendMessage"></button>
      <div class="ct-preview-form-note" data-i18n="PreviewFormNote"></div>
    </form>
  </div>
</section>
</main>

<div id="ct-footer-mount"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
