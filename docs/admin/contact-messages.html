<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contact Messages — Admin Preview</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
<link rel="stylesheet" href="../assets/css/site.css" />
</head>
<body>
<div class="ct-admin-shell">
  <div id="ct-admin-sidebar-mount"></div>
  <main class="ct-admin-main">
    <div id="ct-admin-topbar-mount"></div>
    <div class="table-responsive-ct">
      <table class="table-ct w-100">
        <thead><tr><th>Received</th><th>Name</th><th>Contact</th><th>Subject</th><th>Message</th><th>Status</th><th></th></tr></thead>
        <tbody id="mount"></tbody>
      </table>
    </div>
  </main>
</div>
<script src="../assets/js/admin-data.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
  document.getElementById("mount").innerHTML = ADMIN_CONTACT_MESSAGES.map(function (m) {
    return "<tr><td>" + m.date + "</td><td>" + m.name + "</td><td>" + m.email + "<br/>" + m.mobile + "</td><td>" + m.subject + "</td><td>" + m.message + "</td>" +
      '<td><span class="ct-badge ' + (m.read ? "ct-badge-confirmed" : "ct-badge-pending") + '">' + (m.read ? "Read" : "New") + "</span></td>" +
      "<td>" + (m.read ? "" : '<button class="btn-ct-secondary" style="padding:0.3rem 0.8rem;font-size:0.8rem;" data-admin-action="Marked as read (preview only).">Mark Read</button>') + "</td></tr>";
  }).join("");
</script>
</body>
</html>
