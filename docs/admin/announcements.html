<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Announcements — Admin Preview</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
<link rel="stylesheet" href="../assets/css/site.css" />
</head>
<body>
<div class="ct-admin-shell">
  <div id="ct-admin-sidebar-mount"></div>
  <main class="ct-admin-main">
    <div id="ct-admin-topbar-mount"></div>
    <div class="ct-admin-topbar"><div></div><button class="btn-ct-primary" data-admin-action="New announcement form would open here.">+ New Announcement</button></div>
    <div class="table-responsive-ct">
      <table class="table-ct w-100">
        <thead><tr><th>Title</th><th>Priority</th><th>Active</th><th>Window</th><th></th></tr></thead>
        <tbody id="mount"></tbody>
      </table>
    </div>
  </main>
</div>
<script src="../assets/js/admin-data.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
  document.getElementById("mount").innerHTML = ADMIN_ANNOUNCEMENTS.map(function (a) {
    return "<tr><td>" + a.title + "</td><td>" + a.priority + '</td><td><span class="ct-badge ct-badge-confirmed">Active</span></td><td>' + a.window + "</td>" +
      '<td><a href="#" data-admin-action="Edit form would open here.">Edit</a> <a href="#" data-admin-action="Announcement deleted (preview only).">Delete</a></td></tr>';
  }).join("");
</script>
</body>
</html>
