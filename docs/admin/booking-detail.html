<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Booking Detail — Admin Preview</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
<link rel="stylesheet" href="../assets/css/site.css" />
</head>
<body>
<div class="ct-admin-shell">
  <div id="ct-admin-sidebar-mount"></div>
  <main class="ct-admin-main">
    <div id="ct-admin-topbar-mount"></div>

    <div class="ct-card" style="padding:1.5rem;">
      <table class="table-ct w-100" id="detailTable"></table>

      <div class="ct-divider"></div>
      <div class="d-flex gap-2 flex-wrap" id="actionsMount"></div>
    </div>
  </main>
</div>
<script src="../assets/js/admin-data.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
  var id = parseInt(new URLSearchParams(location.search).get("id"), 10) || ADMIN_BOOKINGS[0].id;
  var b = ADMIN_BOOKINGS.find(function (x) { return x.id === id; }) || ADMIN_BOOKINGS[0];
  document.title = "Booking " + b.number + " — Admin Preview";

  var nights = Math.round((new Date(b.checkOut) - new Date(b.checkIn)) / 86400000);
  document.getElementById("detailTable").innerHTML =
    "<tbody>" +
    "<tr><th>Booking Number</th><td>" + b.number + "</td></tr>" +
    "<tr><th>Guest</th><td>" + b.first + " " + b.last + " &middot; " + b.mobile + " &middot; " + b.email + "</td></tr>" +
    "<tr><th>Room</th><td>" + b.roomType + (b.roomNumber !== "—" ? " (#" + b.roomNumber + ")" : " (not yet assigned)") + "</td></tr>" +
    "<tr><th>Check-in / Check-out</th><td>" + b.checkIn + " &rarr; " + b.checkOut + " (" + nights + " night" + (nights === 1 ? "" : "s") + ")</td></tr>" +
    '<tr><th>Amount</th><td><strong>₹' + b.amount.toLocaleString("en-IN") + "</strong></td></tr>" +
    '<tr><th>Status</th><td><span class="ct-badge ct-badge-default">' + b.status + "</span></td></tr>" +
    "<tr><th>Payment Status</th><td>" + b.payment + "</td></tr>" +
    "</tbody>";

  var actions = [];
  if (b.status === "Pending" || b.status === "PaymentPending") {
    actions.push('<button class="btn-ct-primary" data-admin-action="Booking confirmed (preview only — not saved).">Confirm</button>');
    actions.push('<button class="btn-ct-secondary" data-admin-action="Booking rejected (preview only — not saved).">Reject</button>');
  }
  if (b.status === "Confirmed") {
    actions.push('<button class="btn-ct-primary" data-admin-action="Guest checked in (preview only — not saved).">Check In</button>');
    actions.push('<button class="btn-ct-secondary" data-admin-action="Marked as no-show (preview only — not saved).">Mark No-Show</button>');
  }
  if (b.status === "CheckedIn") {
    actions.push('<button class="btn-ct-primary" data-admin-action="Guest checked out (preview only — not saved).">Check Out</button>');
  }
  if (["Cancelled", "Completed", "CheckedOut", "Rejected"].indexOf(b.status) === -1) {
    actions.push('<button class="btn-ct-secondary" style="color:var(--ct-danger);border-color:var(--ct-danger);" data-admin-action="Booking cancelled (preview only — not saved).">Cancel Booking</button>');
  }
  if (b.payment === "Paid") {
    actions.push('<button class="btn-ct-secondary" style="color:var(--ct-danger);border-color:var(--ct-danger);" data-admin-action="Refund issued (preview only — not saved).">Issue Refund</button>');
  }
  actions.push('<button class="btn-ct-secondary" onclick="window.print()">Print</button>');
  document.getElementById("actionsMount").innerHTML = actions.join("");
</script>
</body>
</html>
