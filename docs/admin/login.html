<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Login — Admin Preview</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
<link rel="stylesheet" href="../assets/css/site.css" />
</head>
<body>
<div class="ct-admin-login-wrap">
  <div class="ct-card" style="padding:2rem;max-width:380px;width:100%;">
    <h3 class="mb-1">Chuli Tirth <span class="ct-muted">Admin</span></h3>
    <p class="ct-muted" style="font-size:0.85rem;">Static preview — not connected to any real authentication. Any email/password signs you in.</p>
    <form id="loginForm">
      <div class="mb-3 ct-field"><label>Email or Mobile</label><input class="form-control" value="admin@chulitirth.local" /></div>
      <div class="mb-3 ct-field"><label>Password</label><input type="password" class="form-control" value="Admin@12345" /></div>
      <button type="submit" class="btn-ct-primary w-100 justify-content-center">Login</button>
    </form>
    <p class="mt-3 text-center"><a href="../index.html">&larr; Back to website</a></p>
  </div>
</div>
<script src="../assets/js/admin-data.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    adminLogin();
    location.href = "dashboard.html";
  });
</script>
</body>
</html>
