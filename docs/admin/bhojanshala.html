<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bhojanshala Timings — Admin Preview</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
<link rel="stylesheet" href="../assets/css/site.css" />
</head>
<body>
<div class="ct-admin-shell">
  <div id="ct-admin-sidebar-mount"></div>
  <main class="ct-admin-main">
    <div id="ct-admin-topbar-mount"></div>
    <div class="ct-admin-topbar"><div></div><button class="btn-ct-primary" data-admin-action="New timing form would open here.">+ New Timing</button></div>
    <div class="table-responsive-ct">
      <table class="table-ct w-100">
        <thead><tr><th>Meal</th><th>Start</th><th>End</th><th>Note</th><th></th></tr></thead>
        <tbody id="mount"></tbody>
      </table>
    </div>
  </main>
</div>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/admin-data.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
  document.getElementById("mount").innerHTML = BHOJANSHALA.map(function (b) {
    var parts = b.time.split(" – ");
    return "<tr data-admin-form><td>" + b.meal.en + '</td><td><input type="text" class="form-control" value="' + parts[0] + '" /></td>' +
      '<td><input type="text" class="form-control" value="' + parts[1] + '" /></td>' +
      '<td><input type="text" class="form-control" value="Sample timing — may vary by Tithi, season or management decision." /></td>' +
      '<td><button class="btn-ct-secondary" style="padding:0.3rem 0.8rem;font-size:0.8rem;" data-admin-action="Timing saved (preview only).">Save</button></td></tr>';
  }).join("");
</script>
</body>
</html>
