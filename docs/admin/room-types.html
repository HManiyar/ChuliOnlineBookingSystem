<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Room Types — Admin Preview</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
<link rel="stylesheet" href="../assets/css/site.css" />
</head>
<body>
<div class="ct-admin-shell">
  <div id="ct-admin-sidebar-mount"></div>
  <main class="ct-admin-main">
    <div id="ct-admin-topbar-mount"></div>

    <div class="ct-admin-topbar"><div></div><button class="btn-ct-primary" data-admin-action="New room type form would open here.">+ New Room Type</button></div>
    <div class="table-responsive-ct">
      <table class="table-ct w-100">
        <thead><tr><th>Name</th><th>Capacity</th><th>Beds</th><th>Price</th><th>AC</th><th>Active</th><th></th></tr></thead>
        <tbody id="roomTypesMount"></tbody>
      </table>
    </div>
  </main>
</div>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/admin-data.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
  document.getElementById("roomTypesMount").innerHTML = ROOM_TYPES.map(function (rt) {
    return "<tr><td>" + rt.name.en + "</td><td>" + rt.capacity + "</td><td>" + rt.beds + "</td><td>₹" + rt.price.toLocaleString("en-IN") + "</td>" +
      "<td>" + (rt.isAC ? "Yes" : "No") + '</td><td><span class="ct-badge ct-badge-confirmed">Active</span></td>' +
      '<td><a href="#" data-admin-action="Edit form for \'' + rt.name.en + '\' would open here.">Edit</a></td></tr>';
  }).join("");
</script>
</body>
</html>
