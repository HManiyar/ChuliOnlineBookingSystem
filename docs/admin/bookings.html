<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookings — Admin Preview</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
<link rel="stylesheet" href="../assets/css/site.css" />
</head>
<body>
<div class="ct-admin-shell">
  <div id="ct-admin-sidebar-mount"></div>
  <main class="ct-admin-main">
    <div id="ct-admin-topbar-mount"></div>

    <form class="ct-card mb-3" style="padding:1rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0.75rem;align-items:end;" data-admin-form>
      <div class="ct-field"><label>Booking #</label><input class="form-control" /></div>
      <div class="ct-field"><label>Guest Name</label><input class="form-control" /></div>
      <div class="ct-field"><label>Mobile</label><input class="form-control" /></div>
      <div class="ct-field">
        <label>Status</label>
        <select class="form-select">
          <option>Any</option>
          <option>Pending</option><option>PaymentPending</option><option>Confirmed</option><option>CheckedIn</option><option>CheckedOut</option><option>Completed</option><option>Cancelled</option><option>Rejected</option>
        </select>
      </div>
      <div><button type="submit" class="btn-ct-primary">Filter</button></div>
    </form>

    <div class="table-responsive-ct">
      <table class="table-ct w-100">
        <thead><tr><th>Booking #</th><th>Guest</th><th>Mobile</th><th>Dates</th><th>Status</th><th>Payment</th><th>Amount</th><th></th></tr></thead>
        <tbody id="bookingsMount"></tbody>
      </table>
    </div>
  </main>
</div>
<script src="../assets/js/admin-data.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
  document.getElementById("bookingsMount").innerHTML = ADMIN_BOOKINGS.map(function (b) {
    return "<tr><td>" + b.number + "</td><td>" + b.first + " " + b.last + "</td><td>" + b.mobile + "</td><td>" + b.checkIn + " &rarr; " + b.checkOut + "</td>" +
      '<td><span class="ct-badge ct-badge-default">' + b.status + "</span></td><td>" + b.payment + "</td><td>₹" + b.amount.toLocaleString("en-IN") + "</td>" +
      '<td><a href="booking-detail.html?id=' + b.id + '">View</a></td></tr>';
  }).join("");
</script>
</body>
</html>
