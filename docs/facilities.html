<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Facilities — Chuli Tirth Dharamshala</title>
<meta name="robots" content="noindex" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&family=Noto+Sans+Gujarati:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
<link rel="stylesheet" href="assets/css/site.css" />
</head>
<body>
<div class="ct-preview-banner" data-i18n="PreviewBannerText"></div>
<div id="ct-navbar-mount"></div>

<main id="ct-main">
<section class="ct-section">
  <div class="container-ct">
    <div class="ct-section-title"><h2 data-i18n="Facilities"></h2></div>
    <div class="ct-grid" style="grid-template-columns: repeat(auto-fill, minmax(160px,1fr));" id="facilitiesMount"></div>
  </div>
</section>
</main>

<div id="ct-footer-mount"></div>

<script src="assets/js/data.js"></script>
<script>
  window.renderDynamicContent = function (lang) {
    var mount = document.getElementById("facilitiesMount");
    mount.innerHTML = FACILITIES.map(function (f) {
      return '<div class="ct-card ct-facility"><i class="bi ' + f.icon + '"></i><div class="label">' + f.name[lang] + '</div></div>';
    }).join("");
  };
</script>
<script src="assets/js/site.js"></script>
</body>
</html>
